[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compilador-planilhas"
version = "0.1.0"
description = "Compilador de planilhas e conversor de PDFs para administração contratual de obras"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.10",
    "rapidfuzz>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13",
    "loguru>=0.7",
]

[project.optional-dependencies]
# Deps pesadas/nativas — instaladas separadamente via aba Configuração
pdf = [
    "camelot-py[cv]>=0.11",
    "pdf2image>=1.16",
    "Pillow>=10",
]
ocr = [
    "pytesseract>=0.3",
]
full = [
    "compilador-planilhas[pdf,ocr]",
]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
compilador = "compilador.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
